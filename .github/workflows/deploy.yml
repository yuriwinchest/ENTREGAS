name: CI/CD Deploy CHIPOWER

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar Build de Produção
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Deploy Automático na VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 179.198.97.28
          username: root
          password: ${{ secrets.VPS_PASSWORD || 'Yuri@20262026' }}
          port: 22
          script: |
            echo "=== INICIANDO DEPLOY AUTOMÁTICO CHIPOWER NA VPS ==="
            mkdir -p /opt/chipower-entregas
            cd /opt/chipower-entregas

            # Atualizar repositório local na VPS
            if [ -d ".git" ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            # Build e Reinicialização dos Containers Docker
            docker compose down --remove-orphans || true
            docker rm -f chipower-web || true
            docker compose build --no-cache
            docker rm -f chipower-web || true
            docker compose up -d

            echo "=== DEPLOY CONCLUÍDO COM SUCESSO! ==="
            docker ps | grep chipower

